<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GESTON AI</title>
<meta name="description" content="GESTON AI — assistant IA">
<meta name="theme-color" content="#0E0E12">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GESTON AI">
<link rel="icon" href="icons/icon-192.png">

<style>
  :root {
    --bg: #0E0E12;
    --surface: #1A1A22;
    --surface-variant: #25252F;
    --primary: #7C5CFF;
    --primary-variant: #5E3FE0;
    --accent: #39E0C4;
    --on-bg: #EDEDF2;
    --on-muted: #9A9AA8;
    --error: #FF5C6C;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--on-bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overscroll-behavior: none;
  }
  #app { height: 100%; display: flex; flex-direction: column; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea { font-family: inherit; color: var(--on-bg); background: transparent; border: none; outline: none; }

  #auth-screen {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    height: 100%; padding: 24px; text-align: center;
  }
  #auth-screen h1 { font-size: 28px; margin: 0 0 4px; }
  #auth-screen p.sub { color: var(--on-muted); margin: 0 0 28px; }
  .auth-field {
    width: 100%; max-width: 340px; margin-bottom: 12px;
    background: var(--surface); border-radius: 12px; padding: 14px 16px;
  }
  .auth-field label { display:block; font-size: 12px; color: var(--on-muted); margin-bottom: 4px; }
  .auth-field input { width: 100%; font-size: 16px; }
  .btn-primary {
    width: 100%; max-width: 340px; background: var(--primary); color: white;
    border-radius: 24px; padding: 14px; font-size: 16px; font-weight: 600; margin-top: 12px;
  }
  .btn-primary:disabled { opacity: 0.5; }
  .link-btn { color: var(--accent); margin-top: 18px; font-size: 14px; }
  .auth-error { color: var(--error); font-size: 14px; margin-top: 10px; max-width: 340px; }

  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 12px; padding-top: max(14px, env(safe-area-inset-top));
    background: var(--bg); flex-shrink: 0;
  }
  #topbar .icon-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 20px; }
  #topbar .icon-btn:active { background: var(--surface); }
  #topbar h2 { margin: 0; font-size: 17px; font-weight: 700; }
  #credits-chip {
    background: var(--surface-variant); padding: 6px 12px; border-radius: 16px; font-size: 13px; color: var(--on-muted);
  }

  #chat-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #chat-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--on-muted); text-align: center; padding: 24px; }
  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .msg-bubble { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.4; }
  .msg-row.user .msg-bubble { background: var(--primary); color: white; }
  .msg-row.assistant .msg-bubble { background: var(--surface-variant); color: var(--on-bg); }
  #chat-error { color: var(--error); padding: 4px 16px; font-size: 14px; }

  #input-bar-wrap { padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); flex-shrink: 0; }
  #input-pill { background: var(--surface-variant); border-radius: 28px; padding: 6px 8px; }
  #input-text { width: 100%; resize: none; font-size: 16px; padding: 10px 10px 4px; max-height: 120px; }
  #input-text::placeholder { color: var(--on-muted); }
  #input-actions { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px; }
  #input-actions .icon-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  #send-btn { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.15); transition: background 0.15s; }
  #send-btn.active { background: var(--primary); }
  #send-btn svg { width: 18px; height: 18px; }

  #drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  #drawer-overlay.open { opacity: 1; pointer-events: auto; }
  #drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 86%; max-width: 320px;
    background: var(--bg); z-index: 41; transform: translateX(-100%);
    transition: transform 0.25s ease; display: flex; flex-direction: column;
    padding: max(20px, env(safe-area-inset-top)) 16px 16px;
  }
  #drawer.open { transform: translateX(0); }
  #drawer h1 { font-size: 20px; margin: 0 0 20px; padding: 0 4px; }
  .nav-item { display: flex; align-items: center; gap: 16px; padding: 12px 4px; border-radius: 10px; font-size: 15px; }
  .nav-item:active { background: var(--surface); }
  .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
  #recents-label { font-size: 12px; color: var(--on-muted); padding: 0 4px; margin-top: 20px; margin-bottom: 6px; }
  #recents-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .recent-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px; border-radius: 10px; font-size: 14px;
  }
  .recent-item.selected { background: var(--surface-variant); }
  .recent-item .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent-item .more-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  #drawer-bottom { display: flex; align-items: center; gap: 10px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); }
  #drawer-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-variant); display:flex; align-items:center; justify-content:center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  #new-conv-btn { flex: 1; background: var(--on-bg); color: var(--bg); border-radius: 24px; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px; }

  #context-menu {
    position: fixed; z-index: 50; background: var(--surface); border-radius: 12px;
    padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); display: none; min-width: 180px;
  }
  #context-menu.open { display: block; }
  #context-menu button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
  #context-menu button:active { background: var(--surface-variant); }
  #context-menu button.danger { color: var(--error); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 60;
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: var(--surface); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0;
    padding: 20px; padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
  .modal-sheet h3 { margin: 0 0 16px; font-size: 18px; }
  .modal-row { margin-bottom: 14px; }
  .modal-row label { display: block; font-size: 12px; color: var(--on-muted); margin-bottom: 4px; }
  .modal-row input { width: 100%; background: var(--surface-variant); padding: 12px; border-radius: 10px; font-size: 15px; }
  .modal-row .value { padding: 10px 0; font-size: 15px; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; }
  .toggle { width: 46px; height: 26px; border-radius: 13px; background: var(--surface-variant); position: relative; flex-shrink: 0; }
  .toggle.on { background: var(--primary); }
  .toggle .knob { width: 20px; height: 20px; border-radius: 50%; background: white; position: absolute; top: 3px; left: 3px; transition: left 0.15s; }
  .toggle.on .knob { left: 23px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 600; }
  .modal-btn-secondary { background: var(--surface-variant); }
  .modal-btn-primary { background: var(--primary); color: white; }
  .modal-btn-danger { background: rgba(255,92,108,0.15); color: var(--error); }
</style>
</head>
<body>
<div id="app">

  <div id="auth-screen" style="display:none;">
    <h1>GESTON AI</h1>
    <p class="sub" id="auth-subtitle">Content de te revoir</p>

    <div class="auth-field" id="field-name" style="display:none;">
      <label>Nom affiché</label>
      <input id="input-name" type="text" autocomplete="name">
    </div>
    <div class="auth-field">
      <label>Email</label>
      <input id="input-email" type="email" autocomplete="email" autocapitalize="off">
    </div>
    <div class="auth-field">
      <label>Mot de passe</label>
      <input id="input-password" type="password" autocomplete="current-password">
    </div>

    <button class="btn-primary" id="auth-submit-btn">Se connecter</button>
    <div class="auth-error" id="auth-error"></div>
    <button class="link-btn" id="auth-toggle-btn">Pas de compte ? S'inscrire</button>
  </div>

  <div id="main-screen" style="display:none; height:100%; display:flex; flex-direction:column;">
    <div id="topbar">
      <button class="icon-btn" id="menu-btn">
        <svg viewBox="0 0 24 24" fill="none" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <h2>GESTON AI</h2>
      <span id="credits-chip" style="display:none;"></span>
    </div>

    <div id="chat-area">
      <div id="chat-empty">Pose ta première question à GESTON AI 👋</div>
    </div>
    <div id="chat-error"></div>

    <div id="input-bar-wrap">
      <div id="input-pill">
        <textarea id="input-text" placeholder="Écris à GESTON AI…" rows="1"></textarea>
        <div id="input-actions">
          <button class="icon-btn" title="Ajouter (bientôt)">
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <div style="display:flex; align-items:center; gap:4px;">
            <button class="icon-btn" title="Dictée (bientôt)">
              <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke="currentColor" stroke-width="2"/><path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button id="send-btn">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="drawer-overlay"></div>
  <div id="drawer">
    <h1>GESTON AI</h1>

    <button class="nav-item" id="nav-discussions">
      <svg viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Discussions</span>
    </button>
    <button class="nav-item" id="nav-profile">
      <svg viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Profil</span>
    </button>
    <button class="nav-item" id="nav-settings">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 005 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Paramètres</span>
    </button>

    <div id="recents-label">Récents</div>
    <div id="recents-list"></div>

    <div id="drawer-bottom">
      <button id="drawer-avatar">?</button>
      <button id="new-conv-btn">
        <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Nouvelle conversation
      </button>
    </div>
  </div>

  <div id="context-menu">
    <button id="ctx-share">Partager</button>
    <button id="ctx-rename">Renommer</button>
    <button id="ctx-delete" class="danger">Supprimer</button>
  </div>

  <div class="modal-overlay" id="profile-modal">
    <div class="modal-sheet">
      <h3>Profil</h3>
      <div class="modal-row">
        <label>Nom affiché</label>
        <input id="profile-name-input" type="text">
      </div>
      <div class="modal-row"><label>Email</label><div class="value" id="profile-email"></div></div>
      <div class="modal-row"><label>Crédits</label><div class="value" id="profile-credits"></div></div>
      <div class="modal-actions">
        <button class="modal-btn-secondary" data-close-modal="profile-modal">Fermer</button>
        <button class="modal-btn-primary" id="profile-save-btn">Enregistrer</button>
      </div>
      <div class="modal-actions">
        <button class="modal-btn-danger" id="logout-btn" style="width:100%;">Se déconnecter</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="settings-modal">
    <div class="modal-sheet">
      <h3>Paramètres</h3>
      <div class="settings-row">
        <span>Mode sombre</span>
        <div class="toggle on" id="dark-toggle"><div class="knob"></div></div>
      </div>
      <div class="settings-row">
        <span>Notifications</span>
        <div class="toggle on" id="notif-toggle"><div class="knob"></div></div>
      </div>
      <div class="modal-actions">
        <button class="modal-btn-secondary" data-close-modal="settings-modal" style="width:100%;">Fermer</button>
      </div>
      <div class="modal-actions">
        <button class="modal-btn-danger" id="delete-account-btn" style="width:100%;">Supprimer mon compte</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="rename-modal">
    <div class="modal-sheet">
      <h3>Renommer la conversation</h3>
      <div class="modal-row"><input id="rename-input" type="text"></div>
      <div class="modal-actions">
        <button class="modal-btn-secondary" data-close-modal="rename-modal">Annuler</button>
        <button class="modal-btn-primary" id="rename-confirm-btn">Enregistrer</button>
      </div>
    </div>
  </div>

</div>

<script>
const API_BASE = 'https://geston-ai-backend.onrender.com/';

const state = {
  token: localStorage.getItem('geston_token') || null,
  user: null,
  conversations: [],
  currentConversationId: null,
  messages: [],
  isSending: false,
  isRegisterMode: false,
  contextMenuConversationId: null,
};

async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API_BASE + path, { ...options, headers });
  return res;
}

function saveToken(token) {
  state.token = token;
  localStorage.setItem('geston_token', token);
}
function clearToken() {
  state.token = null;
  localStorage.removeItem('geston_token');
}

function showAuthScreen() {
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('main-screen').style.display = 'none';
}
function showMainScreen() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'flex';
}

const authSubmitBtn = document.getElementById('auth-submit-btn');
const authToggleBtn = document.getElementById('auth-toggle-btn');
const authSubtitle = document.getElementById('auth-subtitle');
const fieldName = document.getElementById('field-name');
const authError = document.getElementById('auth-error');

authToggleBtn.addEventListener('click', () => {
  state.isRegisterMode = !state.isRegisterMode;
  fieldName.style.display = state.isRegisterMode ? 'block' : 'none';
  authSubtitle.textContent = state.isRegisterMode ? 'Crée ton compte' : 'Content de te revoir';
  authSubmitBtn.textContent = state.isRegisterMode ? "S'inscrire" : 'Se connecter';
  authToggleBtn.textContent = state.isRegisterMode ? 'Déjà un compte ? Se connecter' : "Pas de compte ? S'inscrire";
});

authSubmitBtn.addEventListener('click', async () => {
  const email = document.getElementById('input-email').value.trim();
  const password = document.getElementById('input-password').value;
  const displayName = document.getElementById('input-name').value.trim();
  authError.textContent = '';
  if (!email || !password) return;
  authSubmitBtn.disabled = true;
  try {
    const path = state.isRegisterMode ? 'api/auth/register' : 'api/auth/login';
    const body = state.isRegisterMode ? { email, password, displayName } : { email, password };
    const res = await api(path, { method: 'POST', body: JSON.stringify(body) });
    const data = await res.json();
    if (res.ok) {
      saveToken(data.token);
      state.user = data.user;
      await afterLogin();
    } else {
      authError.textContent = data.error || 'Erreur.';
    }
  } catch (e) {
    authError.textContent = 'Impossible de contacter le serveur.';
  } finally {
    authSubmitBtn.disabled = false;
  }
});

async function afterLogin() {
  showMainScreen();
  await loadMe();
  await loadConversations();
}

async function loadMe() {
  const res = await api('api/auth/me');
  if (res.ok) {
    const data = await res.json();
    state.user = data.user;
    updateProfileUI();
  }
}
function updateProfileUI() {
  if (!state.user) return;
  document.getElementById('drawer-avatar').textContent = (state.user.displayName || state.user.email || '?').slice(0,2).toUpperCase();
  document.getElementById('profile-name-input').value = state.user.displayName || '';
  document.getElementById('profile-email').textContent = state.user.email;
  document.getElementById('profile-credits').textContent = state.user.credits + (state.user.isPremium ? ' (Premium ✨)' : '');
  const chip = document.getElementById('credits-chip');
  chip.textContent = state.user.credits + ' crédits';
  chip.style.display = 'inline-block';
}

async function loadConversations() {
  const res = await api('api/chat/conversations');
  if (res.ok) {
    const data = await res.json();
    state.conversations = data.conversations || [];
    renderRecents();
  }
}
function renderRecents() {
  const list = document.getElementById('recents-list');
  list.innerHTML = '';
  state.conversations.forEach(conv => {
    const row = document.createElement('div');
    row.className = 'recent-item' + (conv.id === state.currentConversationId ? ' selected' : '');
    const titleSpan = document.createElement('span');
    titleSpan.className = 'title';
    titleSpan.textContent = conv.title;
    titleSpan.addEventListener('click', () => openConversation(conv.id));
    const moreBtn = document.createElement('button');
    moreBtn.className = 'more-btn';
    moreBtn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></svg>';
    moreBtn.addEventListener('click', (e) => openContextMenu(e, conv.id));
    row.appendChild(titleSpan);
    row.appendChild(moreBtn);
    list.appendChild(row);
  });
}

async function openConversation(id) {
  closeDrawer();
  const res = await api('api/chat/conversations/' + id);
  if (res.ok) {
    const data = await res.json();
    state.currentConversationId = data.conversation.id;
    state.messages = data.conversation.messages.map(m => ({ role: m.role, content: m.content }));
    renderMessages();
    renderRecents();
  }
}

function startNewConversation() {
  closeDrawer();
  state.currentConversationId = null;
  state.messages = [];
  renderMessages();
  renderRecents();
}

const contextMenu = document.getElementById('context-menu');
function openContextMenu(event, conversationId) {
  event.stopPropagation();
  state.contextMenuConversationId = conversationId;
  const rect = event.target.closest('button').getBoundingClientRect();
  contextMenu.style.top = Math.min(rect.bottom + 6, window.innerHeight - 180) + 'px';
  contextMenu.style.left = Math.max(rect.left - 140, 10) + 'px';
  contextMenu.classList.add('open');
}
document.addEventListener('click', (e) => {
  if (!contextMenu.contains(e.target)) contextMenu.classList.remove('open');
});

document.getElementById('ctx-share').addEventListener('click', async () => {
  contextMenu.classList.remove('open');
  const conv = state.conversations.find(c => c.id === state.contextMenuConversationId);
  const text = 'GESTON AI — ' + (conv ? conv.title : '');
  if (navigator.share) {
    try { await navigator.share({ text }); } catch (e) {}
  } else {
    await navigator.clipboard.writeText(text);
    alert('Copié dans le presse-papiers !');
  }
});

document.getElementById('ctx-rename').addEventListener('click', () => {
  contextMenu.classList.remove('open');
  const conv = state.conversations.find(c => c.id === state.contextMenuConversationId);
  document.getElementById('rename-input').value = conv ? conv.title : '';
  openModal('rename-modal');
});
document.getElementById('rename-confirm-btn').addEventListener('click', async () => {
  const newTitle = document.getElementById('rename-input').value.trim();
  if (!newTitle) return;
  const id = state.contextMenuConversationId;
  const res = await api('api/chat/conversations/' + id, { method: 'PATCH', body: JSON.stringify({ title: newTitle }) });
  if (res.ok) {
    const conv = state.conversations.find(c => c.id === id);
    if (conv) conv.title = newTitle;
    renderRecents();
  }
  closeModal('rename-modal');
});

document.getElementById('ctx-delete').addEventListener('click', async () => {
  contextMenu.classList.remove('open');
  const id = state.contextMenuConversationId;
  const res = await api('api/chat/conversations/' + id, { method: 'DELETE' });
  if (res.ok || res.status === 204) {
    state.conversations = state.conversations.filter(c => c.id !== id);
    if (state.currentConversationId === id) startNewConversation();
    renderRecents();
  }
});

const drawer = document.getElementById('drawer');
const drawerOverlay = document.getElementById('drawer-overlay');
function openDrawer() { drawer.classList.add('open'); drawerOverlay.classList.add('open'); }
function closeDrawer() { drawer.classList.remove('open'); drawerOverlay.classList.remove('open'); }
document.getElementById('menu-btn').addEventListener('click', openDrawer);
drawerOverlay.addEventListener('click', closeDrawer);
document.getElementById('new-conv-btn').addEventListener('click', startNewConversation);
document.getElementById('nav-discussions').addEventListener('click', closeDrawer);
document.getElementById('nav-profile').addEventListener('click', () => { closeDrawer(); openModal('profile-modal'); });
document.getElementById('nav-settings').addEventListener('click', () => { closeDrawer(); openModal('settings-modal'); });
document.getElementById('drawer-avatar').addEventListener('click', () => openModal('profile-modal'));

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('[data-close-modal]').forEach(btn => {
  btn.addEventListener('click', () => closeModal(btn.dataset.closeModal));
});

document.getElementById('profile-save-btn').addEventListener('click', async () => {
  const displayName = document.getElementById('profile-name-input').value.trim();
  const res = await api('api/user/profile', { method: 'PATCH', body: JSON.stringify({ displayName }) });
  if (res.ok) { await loadMe(); closeModal('profile-modal'); }
});
document.getElementById('logout-btn').addEventListener('click', () => {
  clearToken();
  state.user = null;
  state.conversations = [];
  state.messages = [];
  closeModal('profile-modal');
  showAuthScreen();
});

document.getElementById('dark-toggle').addEventListener('click', function () {
  this.classList.toggle('on');
});
document.getElementById('notif-toggle').addEventListener('click', function () {
  this.classList.toggle('on');
});
document.getElementById('delete-account-btn').addEventListener('click', async () => {
  if (!confirm('Supprimer définitivement ton compte ?')) return;
  await api('api/user/account', { method: 'DELETE' });
  clearToken();
  closeModal('settings-modal');
  showAuthScreen();
});

const chatArea = document.getElementById('chat-area');
function renderMessages() {
  chatArea.innerHTML = '';
  if (state.messages.length === 0) {
    const empty = document.createElement('div');
    empty.id = 'chat-empty';
    empty.textContent = 'Pose ta première question à GESTON AI 👋';
    chatArea.appendChild(empty);
    return;
  }
  state.messages.forEach(msg => {
    const row = document.createElement('div');
    row.className = 'msg-row ' + msg.role;
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = msg.content || '…';
    row.appendChild(bubble);
    chatArea.appendChild(row);
  });
  chatArea.scrollTop = chatArea.scrollHeight;
}

const inputText = document.getElementById('input-text');
const sendBtn = document.getElementById('send-btn');
const chatError = document.getElementById('chat-error');

function updateSendBtnState() {
  const hasText = inputText.value.trim().length > 0;
  sendBtn.classList.toggle('active', hasText && !state.isSending);
}
inputText.addEventListener('input', () => {
  inputText.style.height = 'auto';
  inputText.style.height = Math.min(inputText.scrollHeight, 120) + 'px';
  updateSendBtnState();
});

sendBtn.addEventListener('click', () => {
  const text = inputText.value.trim();
  if (!text || state.isSending) return;
  inputText.value = '';
  inputText.style.height = 'auto';
  updateSendBtnState();
  sendMessage(text);
});
inputText.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendBtn.click();
  }
});

async function sendMessage(text) {
  state.isSending = true;
  chatError.textContent = '';
  state.messages.push({ role: 'user', content: text });
  const assistantMsg = { role: 'assistant', content: '' };
  state.messages.push(assistantMsg);
  renderMessages();

  try {
    const res = await fetch(API_BASE + 'api/chat/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.token },
      body: JSON.stringify({ message: text, conversationId: state.currentConversationId }),
    });

    if (!res.ok || !res.body) {
      chatError.textContent = 'Erreur serveur (' + res.status + ')';
      state.isSending = false;
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const lines = part.split('\n');
        let event = '', data = '';
        for (const line of lines) {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          if (line.startsWith('data:')) data = line.slice(5).trim();
        }
        if (!event) continue;
        handleStreamEvent(event, data, assistantMsg);
      }
    }
  } catch (e) {
    chatError.textContent = 'Impossible de contacter le serveur.';
  } finally {
    state.isSending = false;
    updateSendBtnState();
    await loadConversations();
  }
}

function handleStreamEvent(event, data, assistantMsg) {
  try {
    const parsed = JSON.parse(data);
    if (event === 'conversation') {
      state.currentConversationId = parsed.conversationId;
    } else if (event === 'chunk') {
      assistantMsg.content += parsed.text;
      renderMessages();
    } else if (event === 'done') {
      if (parsed.creditsRemaining !== null && parsed.creditsRemaining !== undefined) {
        state.user.credits = parsed.creditsRemaining;
        updateProfileUI();
      }
    } else if (event === 'error') {
      chatError.textContent = parsed.error || 'Erreur lors de la génération de la réponse.';
    }
  } catch (e) {}
}

(async function init() {
  if (state.token) {
    try {
      await afterLogin();
    } catch (e) {
      clearToken();
      showAuthScreen();
    }
  } else {
    showAuthScreen();
  }
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
